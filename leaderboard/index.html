<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>!function(d){d.classList.add("js");var s;try{s=localStorage.getItem("grow_side")}catch(e){}if(!matchMedia("(max-width:60rem)").matches&&(s?s==="mini":matchMedia("(max-width:80rem)").matches))d.classList.add("rail")}(document.documentElement)</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leaderboard, Sttar ambassadors</title>
<meta name="description" content="This month's top Sttar ambassadors and groups.">
<link rel="canonical" href="https://grow.sttar.com/leaderboard/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sttar">
<meta property="og:url" content="https://grow.sttar.com/leaderboard/">
<meta property="og:title" content="Leaderboard, Sttar ambassadors">
<meta property="og:description" content="This month's top Sttar ambassadors and groups.">
<meta property="og:image" content="https://sttar.com/assets/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F7F1EA">
<link rel="icon" href="https://sttar.com/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="https://sttar.com/assets/apple-touch-icon.png">
<link rel="preload" href="../assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/inter-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/site.css">
</head>
<body data-page="leaderboard" data-footer="mini">
<main class="sec-s">
  <div class="container grid12 rows">
    <div class="rows-head">
      <h1>top this month.</h1>
      <p class="lead">Ranked by friends who joined and started posting. It resets on the first of every month.</p>
      <div class="tabs mt-xl" role="tablist" aria-label="Leaderboard">
        <button type="button" role="tab" id="t-people" aria-selected="true">Ambassadors</button>
        <button type="button" role="tab" id="t-groups" aria-selected="false">Groups</button>
      </div>
      <a class="btn" href="/signup/" id="cta" data-cta>Get on the board</a>
    </div>
    <div class="rows-body">
      <table class="board"><thead><tr><th scope="col">Rank</th><th scope="col" id="col">Ambassador</th><th scope="col">Qualified</th><th scope="col">Joined</th></tr></thead><tbody id="board"></tbody></table>
      <div class="empty" id="empty" hidden><b>Nobody here yet this month</b><span id="emptytext">Be the first name on the board.</span></div>
    </div>
  </div>
</main>
<script src="../assets/grow.js"></script>
<script src="../assets/site.js"></script>
<script>
(function () {
  var G = window.GROW, $ = function (id) { return document.getElementById(id); };
  var data = { people: [], groups: [] }, which = /[?&]groups\b/.test(location.search) ? "groups" : "people";
  function render() {
    var g = which === "groups";
    $("t-people").setAttribute("aria-selected", String(!g)); $("t-groups").setAttribute("aria-selected", String(g));
    $("col").textContent = g ? "Group" : "Ambassador";
    if ($("cta")) { $("cta").href = g ? "/signup/?group" : "/signup/"; $("cta").textContent = g ? "Sign up your group" : "Get on the board"; }
    var list = data[which]; $("board").textContent = "";
    $("empty").hidden = list.length > 0; $("emptytext").textContent = g ? "Be the first group on the board." : "Be the first name on the board.";
    list.forEach(function (b) { $("board").appendChild(G.lbRow(b.rank, g ? b.name : "@" + b.username, b.qualified, b.joined)); });
  }
  $("t-people").onclick = function () { which = "people"; render(); };
  $("t-groups").onclick = function () { which = "groups"; render(); };
  render();
  G.get({ a: "public" }).then(function (d) { if (d && d.ok) { data = { people: d.people || [], groups: d.groups || [] }; render(); } }).catch(function () {});
})();
</script>
</body>
</html>
